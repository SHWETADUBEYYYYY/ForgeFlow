<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff Login — {{ clinic_name }}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <div class="auth-card">
      <a class="brand brand-center" href="/">
        <span class="brand-mark">A</span>
        <span class="brand-name">{{ clinic_name }}</span>
      </a>
      <h1 class="auth-title">Staff Login</h1>
      <p class="auth-sub">Sign in to review appointment requests.</p>

      {% if error %}
      <div class="alert alert-error" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login" class="auth-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <p class="auth-note">Demo credentials: <strong>staff</strong> / <strong>dental123</strong></p>
      <p class="auth-note"><a href="/">← Back to website</a></p>
    </div>
  </main>
</body>
</html>
