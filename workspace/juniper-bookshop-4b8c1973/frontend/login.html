<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juniper Books - Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">Juniper Books</a>
            <div class="nav-links">
                <a href="/cart">Cart (<span id="cart-count">0</span>)</a>
                <span id="auth-links">
                    <a href="/login">Login</a>
                    <a href="/register">Register</a>
                </span>
                <span id="user-info" style="display: none;">
                    Welcome, <span id="username-display"></span>! <button id="logout-button">Logout</button>
                </span>
            </div>
        </nav>
    </header>
    <main>
        <div class="form-container">
            <h2>Login</h2>
            <div id="error-message" class="error-message"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <input type="submit" value="Login">
                </div>
            </form>
            <p>Don't have an account? <a href="/register">Register here</a>.</p>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 Juniper Books</p>
    </footer>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
