<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Juniper Books</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/">Juniper Books</a></h1>
            <nav>
                <ul>
                    <li><a href="/cart">Cart (<span id="cart-count">0</span>)</a></li>
                    <li id="auth-links">
                        <a href="/login">Login</a>
                        <a href="/register">Register</a>
                    </li>
                    <li id="user-menu" style="display: none;">
                        <span id="username-display"></span>
                        <a href="/orders">My Orders</a>
                        <button id="logout-button" class="link-button">Logout</button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2>Checkout</h2>
        <div id="checkout-summary">
            <h3>Order Summary</h3>
            <div id="checkout-items-container">
                <p>Loading cart...</p>
            </div>
            <p class="total-summary">Total: <span id="checkout-total">$0.00</span></p>
        </div>

        <div class="checkout-form-section">
            <h3>Shipping Information (Simulated)</h3>
            <form id="checkout-form">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="address">Address:</label>
                    <input type="text" id="address" name="address" required>
                </div>
                <div class="form-group">
                    <label for="city">City:</label>
                    <input type="text" id="city" name="city" required>
                </div>
                <div class="form-group">
                    <label for="zip">Zip Code:</label>
                    <input type="text" id="zip" name="zip" required>
                </div>
                <p class="info-message">This is a simulated checkout. No real payment will be processed.</p>
                <button type="submit" class="button primary">Place Simulated Order</button>
            </form>
            <p id="error-message" class="error-message" style="display: none;"></p>
            <p id="success-message" class="success-message" style="display: none;"></p>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 Juniper Books</p>
        </div>
    </footer>

    <script src="/static/js/utils.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/checkout.js"></script>
</body>
</html>
